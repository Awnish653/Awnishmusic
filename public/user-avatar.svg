<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular clip for entire avatar -->
    <clipPath id="avatar-clip">
      <circle cx="250" cy="250" r="240" />
    </clipPath>

    <!-- Scanline / comic screen pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" stroke-opacity="0.25" />
    </pattern>

    <!-- Background radial glow -->
    <radialGradient id="bgGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#72c6f8" />
      <stop offset="45%" stop-color="#347fb8" />
      <stop offset="85%" stop-color="#143454" />
      <stop offset="100%" stop-color="#091424" />
    </radialGradient>

    <!-- Spiderman suit blue gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ea8de" />
      <stop offset="40%" stop-color="#216fa3" />
      <stop offset="80%" stop-color="#0f3458" />
      <stop offset="100%" stop-color="#081b30" />
    </linearGradient>

    <!-- Head shading gradient -->
    <radialGradient id="headGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6ec5f8" />
      <stop offset="35%" stop-color="#388ec4" />
      <stop offset="70%" stop-color="#1b4d75" />
      <stop offset="100%" stop-color="#091c30" />
    </radialGradient>

    <!-- Eye glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#eaf8ff" />
      <stop offset="100%" stop-color="#cbe5f5" />
    </radialGradient>
  </defs>

  <g clip-path="url(#avatar-clip)">
    <!-- Background Circle Fill -->
    <rect width="500" height="500" fill="url(#bgGlow)" />
    <!-- Background scanlines overlay -->
    <rect width="500" height="500" fill="url(#scanlines)" />

    <!-- Outer vignette shadow inside circle -->
    <circle cx="250" cy="250" r="240" fill="none" stroke="#06101d" stroke-width="18" opacity="0.6" />

    <!-- Upper light bloom -->
    <ellipse cx="200" cy="180" rx="200" ry="160" fill="#a4e2fc" opacity="0.18" />

    <!-- Spider-Man Body / Torso -->
    <path d="M 80 500 C 90 390 140 330 200 320 L 250 340 L 300 320 C 360 330 410 390 420 500 Z" fill="url(#suitGrad)" stroke="#0b1726" stroke-width="8" />

    <!-- Torso Comic Hatching and Shading -->
    <path d="M 80 500 C 100 420 150 360 200 345 C 170 410 160 460 160 500 Z" fill="#081829" opacity="0.75" />
    <path d="M 420 500 C 400 420 350 360 300 345 C 330 410 340 460 340 500 Z" fill="#081829" opacity="0.75" />

    <!-- Torso Web Lines -->
    <g stroke="#091728" stroke-width="4.5" fill="none" stroke-linecap="round">
      <path d="M 250 340 L 250 500" />
      <path d="M 200 340 L 150 500" />
      <path d="M 300 340 L 350 500" />
      <path d="M 140 380 Q 250 420 360 380" />
      <path d="M 120 440 Q 250 480 380 440" />
    </g>

    <!-- Glowing Electric Web / Tree Motif on Chest -->
    <g stroke="#e2f6ff" stroke-width="3" stroke-linecap="round" opacity="0.9" fill="none">
      <path d="M 250 375 L 250 460" stroke-width="4.5" />
      <path d="M 250 400 L 220 380" />
      <path d="M 220 380 L 195 390" />
      <path d="M 220 380 L 210 360" />
      <path d="M 250 420 L 215 415" />
      <path d="M 215 415 L 180 405" />
      <path d="M 215 415 L 205 440" />
      <path d="M 250 400 L 280 380" />
      <path d="M 280 380 L 305 390" />
      <path d="M 280 380 L 290 360" />
      <path d="M 250 420 L 285 415" />
      <path d="M 285 415 L 320 405" />
      <path d="M 285 415 L 295 440" />
      <path d="M 250 445 L 225 465" />
      <path d="M 250 445 L 275 465" />
    </g>

    <!-- Neck -->
    <path d="M 205 270 L 200 330 L 300 330 L 295 270 Z" fill="#143e62" stroke="#081829" stroke-width="6" />

    <!-- Head Silhouette -->
    <!-- Stylized curved Spidey head slightly tilted left -->
    <g transform="rotate(-3 250 200)">
      <path d="M 250 45 C 330 45 375 110 375 200 C 375 275 315 320 250 320 C 185 320 125 275 125 200 C 125 110 170 45 250 45 Z" fill="url(#headGrad)" stroke="#091626" stroke-width="12" stroke-linejoin="round" />

      <!-- Head Web Pattern -->
      <g stroke="#091728" stroke-width="4.5" fill="none" stroke-linecap="round">
        <!-- Vertical web radials -->
        <path d="M 250 160 L 250 48" />
        <path d="M 250 160 L 200 55" />
        <path d="M 250 160 L 300 55" />
        <path d="M 250 160 L 155 80" />
        <path d="M 250 160 L 345 80" />
        <path d="M 250 160 L 130 140" />
        <path d="M 250 160 L 370 140" />
        <path d="M 250 160 L 130 220" />
        <path d="M 250 160 L 370 220" />
        <path d="M 250 160 L 160 285" />
        <path d="M 250 160 L 340 285" />
        <path d="M 250 160 L 250 318" />
        <path d="M 250 160 L 210 315" />
        <path d="M 250 160 L 290 315" />

        <!-- Concentric web arcs (Forehead) -->
        <path d="M 195 70 Q 250 95 305 70" />
        <path d="M 165 105 Q 250 140 335 105" />
        <path d="M 140 150 Q 250 185 360 150" />

        <!-- Concentric web arcs (Chin) -->
        <path d="M 170 260 Q 250 230 330 260" />
        <path d="M 195 290 Q 250 270 305 290" />
      </g>

      <!-- Comic Shadow Layer on Right/Back of Head -->
      <path d="M 285 50 C 345 75 370 135 370 210 C 370 270 330 310 270 318 C 340 300 365 245 360 180 C 355 110 320 65 285 50 Z" fill="#071322" opacity="0.6" />

      <!-- Left Spider Eye (Viewer's Left) -->
      <!-- Black Rim / Outer Frame -->
      <path d="M 140 180 C 160 115 225 110 235 185 C 235 240 170 265 140 180 Z" fill="#081320" stroke="#040b14" stroke-width="9" stroke-linejoin="round" />
      <!-- White Eye Interior -->
      <path d="M 148 180 C 166 128 218 124 226 182 C 226 230 172 250 148 180 Z" fill="url(#eyeGlow)" stroke="#cce6f8" stroke-width="2" />

      <!-- Right Spider Eye (Viewer's Right) -->
      <!-- Black Rim / Outer Frame -->
      <path d="M 360 180 C 340 115 275 110 265 185 C 265 240 330 265 360 180 Z" fill="#081320" stroke="#040b14" stroke-width="9" stroke-linejoin="round" />
      <!-- White Eye Interior -->
      <path d="M 352 180 C 334 128 282 124 274 182 C 274 230 328 250 352 180 Z" fill="url(#eyeGlow)" stroke="#cce6f8" stroke-width="2" />

      <!-- Eye Highlights -->
      <path d="M 160 150 Q 185 135 210 145" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 340 150 Q 315 135 290 145" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- Outer Circular Border Ring -->
    <circle cx="250" cy="250" r="238" fill="none" stroke="#5cc2f8" stroke-width="4" opacity="0.8" />
  </g>
</svg>
